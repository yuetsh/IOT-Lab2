services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_PATH=/app/data/data.sqlite
      - UPLOADS_PATH=/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend
