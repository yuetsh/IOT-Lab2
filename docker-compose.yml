services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/uploads
    environment:
      - DATABASE_PATH=/app/data/data.sqlite
      - UPLOADS_PATH=/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
  uploads_data:
